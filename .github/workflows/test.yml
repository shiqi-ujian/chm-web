name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22  # better-sqlite3@13 需要 Node >= 22

      # native 依赖 better-sqlite3 需编译工具链（ubuntu-latest 自带 build-essential/python3/make）
      - name: Install build tools + 7-Zip
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends p7zip-full 7zip build-essential python3

      - name: Install deps
        run: npm install

      - name: Run tests
        run: |
          node test-serve.js docs/d/7-zip
          node test-hhc.js docs/d/7-zip
          node test-fulltext.js
          node test-fixlinks.js
          node test-site.js
          node test-zip.js
          node test-export-docs.js
          node test-auth.js samples/7-zip.chm
          node test-quota.js samples/7-zip.chm
          node test-xss.js
          node test-search-api.js
          node test-atomic.js
          node test-db.js
          node test-doc-meta.js
          node test-charset.js
          node test-auth-v2.js
          node test-launch-check.js
          node test-ops-tools.js

      # 全站导出冒烟（生成 site-export.zip 验证打包链路）
      - name: Export smoke
        run: |
          node bin/cli.js export-site docs /tmp/site-export.zip
          test -s /tmp/site-export.zip && echo "export OK"